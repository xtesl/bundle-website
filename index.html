
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdom Data Ghana | Affordable Data Prices</title>
  <style>
    /* Loading Screen Styles */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: #1f2937;
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-logo i {
      font-size: 40px;
      color: #1f2937;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(31, 41, 55, 0.1);
      border-top-color: #1f2937;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loading-text {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .loading-subtext {
      font-size: 14px;
      color: #374151;
      opacity: 0.8;
    }

    .loading-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }

    .loading-dots span {
      width: 4px;
      height: 4px;
      background: #1f2937;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="app-loading">
    <div class="loading-content">
      <div class="loading-logo">
        <i class="pi pi-shopping-bag"></i>
      </div>
      <div class="loading-spinner"></div>
      <div class="loading-text">
        Loading
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="loading-subtext">Please wait a moment</div>
    </div>
  </div>

  <!-- Your Vue App -->
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
