<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Kingdom Data Ghana | Affordable Data Prices</title>
  <style>
    /* Loading Screen Styles */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: #1f2937;
    }

    .loading-logo {
      width: 90px;
      height: 90px;
      background: transparent;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2s ease-in-out infinite;
      padding: 10px;
      position: relative;
      overflow: hidden;
    }

    .loading-logo::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #fbbf24, #f59e0b, #fbbf24);
      border-radius: 22px;
      z-index: -1;
      animation: rotate 3s linear infinite;
    }

    .loading-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(31, 41, 55, 0.1);
      border-top-color: #1f2937;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loading-text {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1f2937;
      letter-spacing: 0.5px;
    }

    .loading-subtext {
      font-size: 15px;
      color: #374151;
      opacity: 0.9;
      font-weight: 500;
    }

    .loading-dots {
      display: inline-flex;
      gap: 5px;
      margin-left: 6px;
    }

    .loading-dots span {
      width: 5px;
      height: 5px;
      background: #1f2937;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .loading-logo {
        width: 75px;
        height: 75px;
        padding: 8px;
      }

      .loading-text {
        font-size: 20px;
      }

      .loading-spinner {
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="app-loading">
    <div class="loading-content">
      <div class="loading-logo">
        <img src="https://i.postimg.cc/wjXFgJnM/IMG-20260107-WA0050-1-removebg-preview.png" alt="Kingdom Data Ghana Logo">
      </div>
      <div class="loading-spinner"></div>
      <div class="loading-text">
        Loading
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="loading-subtext">Please wait a moment</div>
    </div>
  </div>

  <!-- Your Vue App -->
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
